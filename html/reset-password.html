<!DOCTYPE html>
<html lang="ar" dir="rtl">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>تغيير كلمة المرور | Home Line</title>
        
        <link rel="stylesheet" href="../css/login.css">
        <link rel="stylesheet" href="../css/translate.css">
    </head>
    
    <script src="../js/reset-password.js"></script>
    <script src="../js/translate.js"></script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<body>

    <div class="container">

        <h1 class="page-title">تغيير كلمة المرور</h1>

        <p class="page-desc">
            أدخلي كلمة المرور الجديدة
        </p>

        <div class="form-box">

            <!-- رسالة الخطأ -->
            <div class="error-box" id="errorBox"></div>

            <!-- رسالة النجاح -->
            <div class="success-msg" id="successBox"></div>

            <!-- نموذج تغيير كلمة المرور -->
            <div id="resetForm">

                <div class="input-group">
                    <label for="password">
                        كلمة المرور الجديدة
                    </label>

                    <input type="password" id="password">
                </div>

                <div class="input-group">
                    <label for="passwordConfirmation">
                        تأكيد كلمة المرور
                    </label>

                    <input type="password" id="passwordConfirmation">
                </div>

                <button class="submit-btn" id="resetBtn">
                    تغيير كلمة المرور
                </button>

            </div>

            <!-- رابط تسجيل الدخول -->
            <p class="switch-link" id="loginLink" style="display:none;">
                <a href="login.html">العودة إلى تسجيل الدخول</a>
            </p>

        </div>

    </div>


</body>

</html>
