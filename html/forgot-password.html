<!DOCTYPE html>
<html lang="ar" dir="rtl">
    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>نسيت كلمة المرور | Home Line</title>
        <link rel="stylesheet" href="../css/login.css">
        <link rel="stylesheet" href="../css/translate.css">
    </head>
    
    <script src="../js/forgot-password.js"></script>
    <script src="../js/translate.js"></script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<body>

    <div class="container">

        <h1 class="page-title">نسيت كلمة المرور؟</h1>

        <p class="page-desc">
            أدخلي اسم المستخدم أو رقم الجوال لاستعادة كلمة المرور
        </p>

        <div class="form-box">

            <div class="error-box" id="errorBox"></div>

            <div class="success-msg" id="successBox"></div>

            <div id="forgotForm">

                <div class="input-group">
                    <label for="loginField">
                        اسم المستخدم أو رقم الجوال
                    </label>

                    <input type="text" id="loginField">
                </div>

                <button class="submit-btn" id="forgotBtn">
                    إرسال رابط إعادة التعيين
                </button>

                <p class="switch-link">
                    تذكرت كلمة المرور؟
                    <a href="login.html">تسجيل الدخول</a>
                </p>

            </div>

        </div>

    </div>


</body>

</html>
