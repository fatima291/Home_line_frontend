<!DOCTYPE html>
<html lang="ar" dir="rtl">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إكمال بيانات الحجز | Home Line</title>
    <link rel="stylesheet" href="../css/customer-info.css">
    <link rel="stylesheet" href="../css/translate.css">
</head>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>
<script src="../js/push-notifications.js"></script>
<script src="../js/customer-info.js"></script>
<script src="../js/translate.js"></script>
<script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<body>

    <div class="container">
        <h1 class="page-title">إكمال بيانات الحجز</h1>
        <p class="page-desc">يرجى تعبئة البيانات لإتمام طلب الحجز</p>

        <!-- صندوق الحجز المباشر -->
        <div class="self-booking-box" id="selfBookingBox">
            <label class="self-checkbox-label">
                <input type="checkbox" id="bookForSelfCheckbox">
                <span class="custom-checkbox"></span>
                 الحجز باسمي
            </label>
            <p class="self-booking-hint">فعّلي هذا الخيار لاستخدام بياناتك المسجلة تلقائياً، أو اتركيه واملئي النموذج أدناه يدوياً لحجز خدمة لشخص آخر</p>
        </div>

        <!-- ملخص الحجز باسمي -->
        <div id="selfConfirmSummary" style="display:none;">
            <div class="summary-box" id="selfSummaryContent"></div>
            <button type="button" id="confirmSelfBtn" class="send-btn">تأكيد الحجز</button>
            <button type="button" id="cancelSelfBtn" class="cancel-btn">إلغاء والعودة للنموذج اليدوي</button>
        </div>

        <!-- نموذج البيانات اليدوي -->
        <div class="form-box">

            <div class="section">
                <h2>بيانات العميل</h2>

                <div class="input-group">
                    <label> الاسم الكامل</label>
                    <input type="text" id="fullName">
                </div>

                <div class="input-group">
                    <label> رقم الجوال</label>
                    <input type="tel" id="phone">
                </div>

                <div class="input-group">
                    <label> رقم الهوية الوطنية</label>
                    <input type="text" id="nationalId">
                </div>

                <div class="input-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="email">
                </div>
            </div>

            <div class="section">
                <h2>عنوان الخدمة</h2>

                <div class="input-group">
                    <label> المدينة</label>
                    <input type="text" id="city">
                </div>

                <div class="input-group">
                    <label> الحي</label>
                    <input type="text" id="neighborhood">
                </div>

                <div class="input-group">
                    <label> الشارع</label>
                    <input type="text" id="street">
                </div>

                <div class="input-group">
                    <label>رقم المبنى</label>
                    <input type="text" id="buildingNumber">
                </div>
            </div>

            <div class="section">
                <h2>موقع الخدمة</h2>

                <div class="input-group">
                    <label>رابط الموقع</label>
                    <input type="text" id="mapLink" placeholder="الصق رابط الموقع من خرائط Google">
                </div>
            </div>

            <div class="section">
                <h2>ملاحظات إضافية</h2>

                <div class="input-group">
                    <textarea id="notes" placeholder="اكتب أي ملاحظة خاصة بالخدمة"></textarea>
                </div>
            </div>

            <div class="section">
                <h2>ملخص الطلب</h2>
                <div class="summary-box" id="orderSummary">
                    <!-- يتم تعبئة ملخص خيارات الخدمة عبر JS -->
                </div>
            </div>
            
            <button class="send-btn" id="sendBtn">متابعة لاختيار طريقة الدفع</button>
        </div>
    </div>

</body>

</html>
