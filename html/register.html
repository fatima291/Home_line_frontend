<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب | Home Line</title>
    <link rel="stylesheet" href="../css/register.css">
    <link rel="stylesheet" href="../css/translate.css">
</head>

<script src="../js/register.js"></script>
<script src="../js/translate.js"></script>
<script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<body>

    <div class="container">
        <h1 class="page-title">إنشاء حساب جديد</h1>
        <p class="page-desc">يرجى تعبئة البيانات التالية لإنشاء حساب جديد</p>

        <div class="form-box">
            <div class="input-group">
                <label for="username"> اسم المستخدم</label>
                <input type="text" id="username">
                <div class="error-msg" id="err-username"></div>
            </div>

            <div class="input-group">
                <label for="fullName"> الاسم الكامل</label>
                <input type="text" id="fullName">
                <div class="error-msg" id="err-full_name"></div>
            </div>

            <div class="row-2">
                <div class="input-group">
                    <label for="phone"> رقم الجوال</label>
                    <input type="tel" id="phone">
                    <div class="error-msg" id="err-phone"></div>
                </div>
                <div class="input-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email">
                    <div class="error-msg" id="err-email"></div>
                </div>
            </div>

            <div class="input-group">
                <label for="nationalId"> رقم الهوية الوطنية</label>
                <input type="text" id="nationalId">
                <div class="error-msg" id="err-national_id"></div>
            </div>

            <div class="row-2">
                <!-- حقل كلمة المرور -->
                <div class="input-group">
                    <label for="password">كلمة المرور</label>
                    <div class="password-wrapper">
                        <input type="password" id="password">
                        <button type="button" class="toggle-password" data-target="password" aria-label="عرض كلمة المرور">
                            <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                    <div class="error-msg" id="err-password"></div>
                </div>

                <!-- حقل تأكيد كلمة المرور -->
                <div class="input-group">
                    <label for="passwordConfirm">تأكيد كلمة المرور</label>
                    <div class="password-wrapper">
                        <input type="password" id="passwordConfirm">
                        <button type="button" class="toggle-password" data-target="passwordConfirm" aria-label="عرض تأكيد كلمة المرور">
                            <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
            <div class="row-2">
                <div class="input-group">
                    <label for="city">المدينة</label>
                    <select id="city" onchange="updateNeighborhoods()">
                        <option value="">اختر المدينة</option>
                        <option value="دمشق">دمشق</option>
                        <option value="ريف دمشق">ريف دمشق</option>
                        <option value="حلب">حلب</option>
                        <option value="حمص">حمص</option>
                        <option value="حماة">حماة</option>
                        <option value="اللاذقية">اللاذقية</option>
                        <option value="طرطوس">طرطوس</option>
                        <option value="درعا">درعا</option>
                        <option value="السويداء">السويداء</option>
                        <option value="القنيطرة">القنيطرة</option>
                        <option value="دير الزور">دير الزور</option>
                        <option value="الحسكة">الحسكة</option>
                        <option value="الرقة">الرقة</option>
                    </select>
                    <div class="error-msg" id="err-city"></div>
                </div>
                
                <div class="input-group">
                    <label for="neighborhood">الحي</label>
                    <select id="neighborhood">
                        <option value="">اختر المدينة أولاً</option>
                    </select>
                    <div class="error-msg" id="err-neighborhood"></div>
                </div>
            </div>

            <div class="row-2">
                <div class="input-group">
                    <label for="street"> الشارع</label>
                    <input type="text" id="street">
                    <div class="error-msg" id="err-street"></div>
                </div>
                <div class="input-group">
                    <label for="buildingNumber">رقم المبنى</label>
                    <input type="text" id="buildingNumber">
                </div>
            </div>

            <div class="input-group">
                <label for="locationLink">رابط الموقع (خرائط Google)</label>
                <input type="text" id="locationLink" placeholder="اختياري">
            </div>

            <button class="submit-btn" id="registerBtn">إنشاء الحساب</button>

            <p class="switch-link">لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a></p>
        </div>
    </div>

</body>

</html>
