<!DOCTYPE html>
<html lang="ar" dir="rtl">
    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>تسجيل الدخول | Home Line</title>
        <link rel="stylesheet" href="../css/login.css">
        <link rel="stylesheet" href="../css/translate.css">
    </head>
    
    <script src="../js/login.js"></script>
    <script src="../js/translate.js"></script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<body>

    <div class="container">
        <h1 class="page-title">تسجيل الدخول</h1>
        <p class="page-desc">يرجى إدخال بيانات الدخول للمتابعة</p>

        <div class="form-box">
            <div class="error-box" id="errorBox"></div>

            <div class="input-group">
                <label for="loginField">اسم المستخدم أو رقم الجوال</label>
                <input type="text" id="loginField">
            </div>

            <div class="input-group">
                <label for="password">كلمة المرور</label>
                <div class="password-wrapper">
                    <input type="password" id="password">
                    <button type="button" class="toggle-password" data-target="password" aria-label="عرض كلمة المرور">
                        <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
            </div>
            <button class="submit-btn" id="loginBtn">تسجيل الدخول</button>

            <a href="forgot-password.html" class="forgot-password-link"> نسيت كلمة المرور؟</a>

            <p class="switch-link">ليس لديك حساب؟ <a href="register.html">إنشاء حساب جديد</a></p>
        </div>
    </div>

</body>

</html>
