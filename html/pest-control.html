<!DOCTYPE html>
<html lang="ar" dir="rtl">
    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>خدمة مكافحة الحشرات | HOME Line</title>
        <link rel="stylesheet" href="../css/pest-control.css">
        <link rel="stylesheet" href="../css/translate.css">
    </head>
    
    <!-- External Script -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>
    <script src="../js/push-notifications.js"></script>
    <script src="../js/pest-control.js"></script>
    <script src="../js/translate.js"></script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<body>

    <!-- Header -->
    <header class="top-header">
        <div class="logo">
            <a href="#">HOME LINE</a>
        </div>
        <nav>
            <ul>
                <li><a href="../homeline.html">الرئيسية</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- خيارات مكافحة الحشرات -->
        <section class="pest-section">
            <div class="title-box">
                <h1>🐜 خدمة مكافحة الحشرات</h1>
                <p>اختر نوع الخدمة المناسبة لمنزلك</p>
            </div>

            <div class="services-grid">
                <!-- بطاقة 1 -->
                <div class="service-card">
                    <div class="card-icon">🛏️</div>
                    <h3>مكافحة حشرات غرفة واحدة</h3>
                    <span class="price">1200 ل.س</span>
                    <label class="choose-service">
                        <input type="radio" name="pestService" value="غرفة واحدة">
                        <span>اختيار</span>
                    </label>
                </div>

                <!-- بطاقة 2 -->
                <div class="service-card">
                    <div class="card-icon">🛋️</div>
                    <h3>مكافحة حشرات غرفتين</h3>
                    <span class="price">1800 ل.س</span>
                    <label class="choose-service">
                        <input type="radio" name="pestService" value="غرفتين">
                        <span>اختيار</span>
                    </label>
                </div>

                <!-- بطاقة 3 -->
                <div class="service-card">
                    <div class="card-icon">🏠</div>
                    <h3>مكافحة حشرات ثلاث غرف</h3>
                    <span class="price">2400 ل.س</span>
                    <label class="choose-service">
                        <input type="radio" name="pestService" value="ثلاث غرف">
                        <span>اختيار</span>
                    </label>
                </div>

                <!-- بطاقة 4 -->
                <div class="service-card">
                    <div class="card-icon">🏡</div>
                    <h3>مكافحة المنزل بالكامل</h3>
                    <span class="price">3500 ل.س</span>
                    <label class="choose-service">
                        <input type="radio" name="pestService" value="المنزل بالكامل">
                        <span>اختيار</span>
                    </label>
                </div>
            </div>
        </section>

        <!-- وقت الخدمة -->
        <div class="service-info-box">
            <h3>🕒 معلومات الخدمة</h3>

            <div class="input-group">
                <label for="pestPeriod">وقت الخدمة</label>
                <select class="custom-select" id="pestPeriod">
                    <option value="morning">☀️ صباحي</option>
                    <option value="evening">🌙 مسائي</option>
                </select>
            </div>

            <div class="input-group">
                <label for="pestDate">تاريخ الخدمة</label>
                <input type="date" class="date-input" id="pestDate">
            </div>
        </div>

        <!-- زر التأكيد -->
        <div class="confirm-section">
            <button type="button" class="confirm-btn">تأكيد</button>
        </div>
    </main>

</body>

</html>
